<!DOCTYPE html>
<html lang="en">

<head>
    <title>ROC Nijmegen</title>
    <link rel="stylesheet" href="style/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Doppio+One&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page">
        <div class="container-hero">
            <header>
                <img class="nijmegen-logo" src="assets/ROC-Nijmegen-logo-300x147.png" alt="logo">
                <nav>
                    <img class="nav-icons" src="assets/home-icon.png" alt="home-icon">
                    <a href="home.html">Home</a>
                    <img class="nav-icons" src="assets/book-icon.png" alt="info-icon">
                    <a href="overopleiding.html">Over de Opleiding</a>
                    <img class="nav-icons" src="assets/contact-icon.png" alt="contact-icon">
                    <a href="contact.html">Contact</a>
                    <img class="nav-icons" src="assets/info-icon.png" alt="info-icon">
                    <a href="over-ons.html">Over Ons</a>
                </nav>
            </header>
        </div>
        <div class="black-gap"></div>
        <div class="container-contact">
            <main class="main-content">
                <h1>Contact</h1>
                <div class="contact-box">
                    <h2>Stel je vraag</h2>
                    <form class="contact-form">
                        <div class="input-group">
                            <label>Voornaam *</label>
                            <input type="text" name="voornaam">
                        </div>
                        <div class="input-group">
                            <label>Achternaam</label>
                            <input type="text" name="achternaam">
                        </div>
                        <div class="input-group">
                            <label>Email *</label>
                            <input type="email" name="email">
                        </div>
                        <div class="input-group">
                            <label>Telefoonnummer</label>
                            <input type="tel" name="telefoon">
                        </div>
                        <div class="input-group">
                            <label>Jouw vraag *</label>
                            <textarea name="vraag" rows="5"></textarea>
                        </div>
                        <button type="submit" class="send-button">Versturen</button>
                    </form>
                    <div class="info">
                        <p class="time-text">We zijn bereikbaar</p>
                        <p class="hours">tussen 08:00 en 16:30</p>
                        <a href="tel:0248904500" class="phone-button">
                            <span class="phone-number">024-89 04 500</span>
                            <span class="phone-label">Algemeen nummer</span>
                        </a>
                    </div>
                </div>
            </main>
        </div>
        <div class="more-about-us">
            <a href="contact.html">
                <div class="about-png">
                    <img class="png-about-us" src="assets/vragen.png" alt="vragen-icon">
                    Veelgestelde vragen
                </div>
            </a>
            <a href="contact.html">
                <div class="about-png">
                    <img class="png-about-us" src="assets/contact-icon.png" alt="contact-icon">
                    024 - 89 04 500
                </div>
            </a>
            <a href="contact.html">
                <div class="about-png">
                    <img class="png-about-us" src="assets/Mail.png" alt="mail-icon">
                    Mail ons
                </div>
            </a>
            <a href="contact.html">
                <div class="about-png">
                    <img class="png-about-us" src="assets/info-icon.png" alt="info-icon">
                    Studiekeuzeadvies
                </div>
            </a>
        </div>
        <footer>
            <div class="socials-icons">
                <a href="https://www.instagram.com/rocnijmegen/" target="_blank">
                    <img class="social-png" src="assets/insta-icon.png" alt="instagram-icon">
                </a>
                <a href="https://www.facebook.com/rocnijmegen/?locale=nl_NL" target="_blank">
                    <img class="social-png" src="assets/facebook-icon.png" alt="facebook-icon">
                </a>
                <a href="https://x.com/rocnijmegen" target="_blank">
                    <img class="social-png" src="assets/twitter-icon.jpg" alt="twitter-icon">
                </a>
                <a href="https://www.youtube.com/@rocnijmegen" target="_blank">
                    <img class="social-png" src="assets/youtube-icon.png" alt="youtube-icon">
                </a>
            </div>
        </footer>
    </div>
</body>

</html>
